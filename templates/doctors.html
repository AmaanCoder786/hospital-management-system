{% extends "base.html" %}

{% block content %}

<h2 class="text-center mb-4">Doctors</h2>

<a href="/add-doctor" class="btn btn-primary mb-3">
    Add Doctor
</a>

<table class="table table-bordered table-hover">

    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Specialization</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>

    {% for doctor in doctors %}

    <tr>

        <td>{{ doctor[0] }}</td>

        <td>{{ doctor[1] }}</td>

        <td>{{ doctor[2] }}</td>

        <td>{{ doctor[3] }}</td>

        <td>{{ doctor[4] }}</td>

        <td>
            <a href="/edit-doctor/{{ doctor[0] }}" class="btn btn-sm btn-warning">
                Edit
            </a>
            <a href="/delete-doctor/{{ doctor[0] }}" class="btn btn-sm btn-danger"
            onclick="return confirm('Delete this doctor?');">
                Delete
            </a>
        </td>

    </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
