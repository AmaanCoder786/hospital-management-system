{% extends "base.html" %}

{% block content %}

<div class="patient-form-container">
    <div class="patient-form-card">
        <div class="form-header">
            <div class="form-header-icon">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <div>
                <h3>Add New Patient</h3>
                <p>Register a new patient in the hospital system</p>
            </div>
        </div>

        <hr>

        <form method="POST">
            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-person"></i>
                    Full Name
                </label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ form.get('name', '') }}"
                    placeholder="Enter patient's full name"
                    required
                    maxlength="100"
                >
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label">
                        <i class="bi bi-calendar3"></i>
                        Age
                    </label>
                    <input
                        type="number"
                        name="age"
                        class="form-control"
                        value="{{ form.get('age', '') }}"
                        placeholder="Enter age"
                        min="0"
                        max="120"
                        required
                    >
                    <small class="form-text">Age must be between 0 and 120.</small>
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label">
                        <i class="bi bi-gender-ambiguous"></i>
                        Gender
                    </label>
                    <select name="gender" class="form-select" required>
                        <option value="">Select Gender</option>
                        {% for gender in ["Male", "Female", "Other"] %}
                            <option
                                value="{{ gender }}"
                                {% if form.get('gender') == gender %}selected{% endif %}
                            >
                                {{ gender }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-telephone"></i>
                    Phone Number
                </label>
                <input
                    type="tel"
                    name="phone"
                    class="form-control"
                    value="{{ form.get('phone', '') }}"
                    placeholder="Enter 10-digit phone number"
                    minlength="10"
                    maxlength="10"
                    inputmode="numeric"
                    pattern="[0-9]{10}"
                    required
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i>
                    Save Patient
                </button>
                <a href="{{ url_for('patients') }}" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i>
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
