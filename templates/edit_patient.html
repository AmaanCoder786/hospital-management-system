{% extends "base.html" %}

{% block content %}

<h2>Edit Patient</h2>

<form method="POST">

    <div class="mb-3">
        <label>Name</label>
        <input type="text"
               name="name"
               class="form-control"
               value="{{ patient[1] }}">
    </div>

    <div class="mb-3">
        <label>Age</label>
        <input type="number"
               name="age"
               class="form-control"
               value="{{ patient[2] }}">
    </div>

    <div class="mb-3">
        <label>Gender</label>
        <input type="text"
               name="gender"
               class="form-control"
               value="{{ patient[3] }}">
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input type="text"
               name="phone" 
               class="form-control"
               value="{{ patient[4] }}">
    </div>

    <button type="submit"
            class="btn btn-warning">
        Update Patient
    </button>

</form>

{% endblock %}
