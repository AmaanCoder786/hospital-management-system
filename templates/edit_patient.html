{% extends "base.html" %}

{% block content %}

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Name</label>
        <input
            type="text"
            name="name"
            class="form-control"
            value="{{ patient[1] }}"
            required
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Age</label>

        <input
            type="number"
            name="age"
            class="form-control"
            value="{{ patient[2] }}"
            min="0"
            max="120"
            required
        >

        <div class="form-text">
            Age must be between 0 and 120.
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Gender</label>

        <select name="gender" class="form-select" required>

            <option value="Male"
                {% if patient[3] == "Male" %}selected{% endif %}>
                Male
            </option>

            <option value="Female"
                {% if patient[3] == "Female" %}selected{% endif %}>
                Female
            </option>

            <option value="Other"
                {% if patient[3] == "Other" %}selected{% endif %}>
                Other
            </option>

        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Phone</label>

        <input
            type="tel"
            name="phone"
            class="form-control"
            value="{{ patient[4] }}"
            pattern="[0-9]{10}"
            required
        >
    </div>

    <button type="submit" class="btn btn-warning">
        Update Patient
    </button>

    <a href="/patients" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
