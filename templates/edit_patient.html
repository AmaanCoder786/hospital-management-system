{% extends "base.html" %}

{% block content %}

<div class="patient-form-container">

    <div class="patient-form-card">

        <!-- Form Header -->
        <div class="form-header mb-4">

            <div class="form-header-icon">
                <i class="bi bi-pencil-square"></i>
            </div>

            <div>
                <h3>Edit Patient</h3>
                <p>Update the patient's information below</p>
            </div>

        </div>

        <hr class="mb-4">
        <form method="POST">

            <!-- Full Name: Full Width -->
            <div class="mb-4">

                <label class="form-label">
                    <i class="bi bi-person"></i>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ patient[1] }}"
                    placeholder="Enter patient's full name"
                    required
                >

            </div>


            <!-- Age + Gender: Two Columns -->
            <div class="row">

                <!-- Age -->
                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        <i class="bi bi-calendar3"></i>
                        Age
                    </label>

                    <input
                        type="number"
                        name="age"
                        class="form-control"
                        value="{{ patient[2] }}"
                        min="0"
                        max="120"
                        placeholder="Enter patient's age"
                        required
                    >

                    <div class="form-text">
                        Age must be between 0 and 120.
                    </div>

                </div>


                <!-- Gender -->
                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        <i class="bi bi-gender-ambiguous"></i>
                        Gender
                    </label>

                    <select name="gender" class="form-select" required>

                        <option value="">Select Gender</option>

                        <option value="Male"
                            {% if patient[3] == "Male" %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                            {% if patient[3] == "Female" %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other"
                            {% if patient[3] == "Other" %}selected{% endif %}>
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <!-- Phone: Full Width -->
            <div class="mb-4">

                <label class="form-label">
                    <i class="bi bi-telephone"></i>
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    class="form-control"
                    value="{{ patient[4] }}"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <!-- Actions -->
            <div class="form-actions">

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i>
                    Update Patient
                </button>

                <a href="{{ url_for('patients') }}" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i>
                    Cancel
                </a>

            </div>

        </form>
    </div>

</div>

{% endblock %}
