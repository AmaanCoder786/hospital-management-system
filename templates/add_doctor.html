{% extends "base.html" %}

{% block content %}

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Doctor Name</label>
        <input
            type="text"
            name="name"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Specialization</label>
        <input
            type="text"
            name="specialization"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Phone</label>
        <input
            type="text"
            name="phone"
            class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input
            type="email"
            name="email"
            class="form-control">
    </div>

    <button class="btn btn-success">
        Add Doctor
    </button>

</form>

{% endblock %}
