{% extends "base.html" %}

{% block content %}

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Doctor Name</label>
        <input
            type="text"
            name="name"
            class="form-control"
            value="{{ form.name if form else '' }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Specialization</label>
        <input
            type="text"
            name="specialization"
            class="form-control"
            value="{{ form.specialization if form else '' }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Phone</label>
        <input
            type="text"
            name="phone"
            class="form-control"
            value="{{ form.phone if form else '' }}"
            maxlength="10">
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input
            type="email"
            name="email"
            class="form-control"
            value="{{ form.email if form else '' }}">
    </div>

    <button class="btn btn-success">
        Add Doctor
    </button>
</form>

{% endblock %}
