{% extends "base.html" %}

{% block content %}

<div class="patient-form-container">
    <div class="patient-form-card">
        <div class="form-header">
            <div class="form-header-icon">
                <i class="bi bi-person-badge-fill"></i>
            </div>
            <div>
                <h3>Add New Doctor</h3>
                <p>Register a doctor in the hospital system</p>
            </div>
        </div>

        <hr>

        <form method="POST">
            <div class="mb-4">
                <label class="form-label">Doctor Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ form.get('name', '') }}"
                    required
                    maxlength="100"
                >
            </div>

            <div class="mb-4">
                <label class="form-label">Specialization</label>
                <input
                    type="text"
                    name="specialization"
                    class="form-control"
                    value="{{ form.get('specialization', '') }}"
                    required
                    maxlength="100"
                >
            </div>

            <div class="mb-4">
                <label class="form-label">Phone</label>
                <input
                    type="tel"
                    name="phone"
                    class="form-control"
                    value="{{ form.get('phone', '') }}"
                    minlength="10"
                    maxlength="10"
                    inputmode="numeric"
                    pattern="[0-9]{10}"
                    placeholder="10-digit phone number"
                    required
                >
            </div>

            <div class="mb-4">
                <label class="form-label">Email</label>
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ form.get('email', '') }}"
                    maxlength="150"
                    required
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-lg"></i>
                    Add Doctor
                </button>
                <a href="{{ url_for('doctors') }}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
