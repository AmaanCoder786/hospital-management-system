{% extends "base.html" %}

{% block content %}

<!-- Patient Actions -->
<div class="d-flex justify-content-between align-items-center mb-4 gap-3">

    <!-- Add Patient Button -->
    <a href="/add-patient" class="btn btn-success">
        <i class="bi bi-person-plus-fill"></i>
        Add Patient
    </a>

    <!-- Search Form -->
    <form method="GET" action="/patients" class="patient-search-form">
        <div class="input-group">

            <input
                type="text"
                name="search"
                class="form-control"
                placeholder="Search by patient name..."
                value="{{ search }}"
            >

            <!-- Search Button -->
            <button
                class="btn btn-primary"
                type="submit"
                title="Search"
            >
                <i class="bi bi-search"></i>
            </button>

            <!-- Clear Button -->
            <a
                href="/patients"
                class="btn btn-secondary"
                title="Clear search"
            >
                <i class="bi bi-x-lg"></i>
            </a>

        </div>
    </form>

</div>


<!-- Patients Table -->
<div class="table-responsive">

    <table class="table table-bordered table-striped patients-table">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% if patients %}

                {% for patient in patients %}

                <tr>

                    <td>{{ patient[0] }}</td>

                    <td class="fw-semibold">
                        {{ patient[1] }}
                    </td>

                    <td>{{ patient[2] }}</td>

                    <td>
                        <span class="badge bg-secondary">
                            {{ patient[3] }}
                        </span>
                    </td>

                    <td>{{ patient[4] }}</td>

                    <td>

                        <a
                            href="/edit-patient/{{ patient[0] }}"
                            class="btn btn-warning btn-sm"
                            title="Edit patient"
                        >
                            <i class="bi bi-pencil-square"></i>
                            Edit
                        </a>

                        <form
                            method="POST"
                            action="{{ url_for('delete_patient', id=patient[0]) }}"
                            class="d-inline"
                            onsubmit="return confirm('Are you sure you want to delete this patient?')"
                        >
                            <button
                                type="submit"
                                class="btn btn-danger btn-sm"
                                title="Delete patient"
                            >
                                <i class="bi bi-trash"></i>
                                Delete
                            </button>
                        </form>

                    </td>

                </tr>

                {% endfor %}

            {% else %}

                <tr>
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-person-x fs-4 d-block mb-2"></i>
                        No patients found.
                    </td>
                </tr>

            {% endif %}

        </tbody>

    </table>

</div>

{% endblock %}
