{% extends "base.html" %}

{% block content %}

<h2 class="text-center mb-4">Dashboard</h2>

<div class="row">

    <div class="col-md-3 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h5>Total Patients</h5>
                <h2>{{ total_patients }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h5>Total Doctors</h5>
                <h2>{{ total_doctors }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h5>Appointments</h5>
                <h2>{{ total_appointments }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h5>Pending</h5>
                <h2>0</h2>
            </div>
        </div>
    </div>

</div>

{% endblock %}
