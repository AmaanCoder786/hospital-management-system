{% extends "base.html" %}

{% block content %}

<h2 class="text-center mb-4">Dashboard</h2>

<div class="row">

    <div class="col-md-3 mb-3">
        <div class="dashboard-card">
            <div class="dashboard-card-body">
                <i class="bi bi-people-fill dashboard-icon text-primary"></i>
                <h2 class="dashboard-number">{{ total_patients }}</h2>
                <p class="dashboard-title">Total Patients</p>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="dashboard-card">
            <div class="dashboard-card-body">
                <i class="bi bi-person-badge-fill dashboard-icon text-success"></i>
                <h2 class="dashboard-number">{{ total_doctors }}</h2>
                <p class="dashboard-title">Total Doctors</p>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="dashboard-card">
            <div class="dashboard-card-body">
                <i class="bi bi-calendar-check dashboard-icon text-warning"></i>
                <h2 class="dashboard-number">{{ total_appointments }}</h2>
                <p class="dashboard-title">Appointments</p>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="dashboard-card">
            <div class="dashboard-card-body">
                <i class="bi bi-hourglass-split dashboard-icon text-danger"></i>
                <h2 class="dashboard-number">0</h2>
                <p class="dashboard-title">Pending</p>
            </div>
        </div>
    </div>

</div>

{% endblock %}
